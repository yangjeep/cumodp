name: Reconstruct SVN history

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconstruct-svn-history.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct partial SVN history
        run: python3 .svn-recovery/reconstruct_history.py
